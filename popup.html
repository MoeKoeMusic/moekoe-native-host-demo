<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>本地程序通信Demo</h1>
    <p id="status">正在读取状态...</p>
    <textarea id="message" rows="4" spellcheck="false">来自插件弹窗的测试消息</textarea>
    <div class="actions">
      <button id="send">发送消息</button>
      <button id="refresh">刷新状态</button>
    </div>
    <pre id="events"></pre>
  </main>
  <script src="popup.js"></script>
</body>
</html>
